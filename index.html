<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- TODO: put your name in the title and og:title -->
    <title>IT Student Portfolio — Internship & OJT</title>
    <meta
      name="description"
      content="Portfolio of an IT student seeking a software development internship or OJT: projects, skills, education, and contact details."
    />
    <meta name="theme-color" content="#0d0818" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IT Student Portfolio — Internship & OJT" />
    <meta
      property="og:description"
      content="Projects, skills, and contact details of an IT student looking for a software development internship or OJT."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Self-hosted fonts (see src/index.css): fetched in parallel with the JS so they
         are ready before the first render and never trigger a late re-layout -->
    <link rel="preload" href="/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Apply the saved or system theme before first paint to avoid a flash -->
    <script>
      try {
        var stored = localStorage.getItem('portfolio-theme')
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript enabled to display.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
